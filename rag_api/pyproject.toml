[project]
name = "contract-intel-api"
version = "0.1.0"
description = "FastAPI inbound adapter: answers questions over contracts; read-only access to the vector index."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "contract-intel",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv.sources]
contract-intel = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

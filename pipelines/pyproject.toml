[project]
name = "contract-intel-pipelines"
version = "0.1.0"
description = "Dagster inbound adapter: ingests, extracts and embeds contracts; sole writer of the vector index."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "contract-intel",
    "dagster>=1.8",
    "dagster-webserver>=1.8",
]

[tool.uv.sources]
contract-intel = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
